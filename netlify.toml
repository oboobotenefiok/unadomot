# netlify.toml
[build]
  command = "node inject-env.js"
  publish = "."

# ===== Email verification — MUST be declared before the SPA wildcard =====
# Firebase email links always use /verify-email as the base path (set in the
# Firebase Console action URL template). These rules serve verify-email.html
# for that path so the standalone page can read the oobCode from the query
# string and call applyActionCode() correctly.
[[redirects]]
from = "/verify-email"
to = "/verify-email.html"
status = 200

[[redirects]]
from = "/verify-email/*"
to = "/verify-email.html"
status = 200

# Redirects for SPA (so React routing works)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# ============================================
# CACHE CONTROL HEADERS
# ============================================

# JavaScript files - always check for updates
[[headers]]
for = "*.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# CSS files - always check for updates
[[headers]]
for = "*.css"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

# HTML files - never cache
[[headers]]
for = "*.html"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "index.html"
[headers.values]
Cache-Control = "no-cache"

# Images - cache for 1 year
[[headers]]
for = "*.jpg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.jpeg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.png"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.gif"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.webp"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.svg"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.ico"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"