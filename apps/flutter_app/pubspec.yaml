name: unadomot
description: UnaDomot rental marketplace rewrite.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  image_picker: ^1.0.7
  file_picker: ^8.1.2
  flutter_secure_storage: ^9.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../vault/img/unadomot.jpg
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: ../../vault/img/unadomot.jpg
