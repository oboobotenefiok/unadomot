name: unadomot
description: UnaDomot rental marketplace rewrite.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.4
  image_picker: ^1.0.7
  file_picker: ^10.3.3
  record: ^5.1.2
  audioplayers: ^6.1.0
  flutter_secure_storage: ^9.0.0
  flutter_webrtc: ^1.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  google_sign_in: ^6.2.1
  app_links: ^6.3.2
  shimmer: ^3.0.0
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
dependency_overrides:
  record_linux: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/unadomot.jpg
  adaptive_icon_background: "#0F5132"
  adaptive_icon_foreground: assets/unadomot.jpg
