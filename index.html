    <!-- Dynamic CSS loading based on screen size -->
    <script>
        (function() {
            function loadCSS(href) {
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                document.head.appendChild(link);
            }
            
            function loadAppropriateCSS() {
                var width = window.innerWidth;
                if (width < 768) {
                    loadCSS('/styles/mobile.css');
                } else {
                    loadCSS('/styles/desktop.css');
                }
            }
            
            // Load on initial page load
            loadAppropriateCSS();
            
            // Reload on resize (debounced)
            var resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    // Remove old CSS
                    var links = document.querySelectorAll('link[rel="stylesheet"][href*="mobile.css"], link[rel="stylesheet"][href*="desktop.css"]');
                    links.forEach(function(link) { link.remove(); });
                    
                    // Load new CSS
                    loadAppropriateCSS();
                }, 250);
            });
        })();
    </script>

    <!-- ===== CRITICAL: DARK MODE - MUST RUN BEFORE ANY RENDERING ===== -->
    <script>
        (function() {
            // Check dark mode preference - runs BEFORE anything renders
            var isDark = localStorage.getItem('darkMode') === 'true';
            
            if (isDark) {
                // Apply to body immediately
                document.body.classList.add('dark-mode');
                
                // Update theme-color meta tag
                var themeColor = document.querySelector('meta[name="theme-color"]');
                if (themeColor) {
                    themeColor.setAttribute('content', '#0f1722');
                }
                
                // Create style tag that applies dark mode BEFORE any content renders
                var style = document.createElement('style');
                style.textContent =
                    '.splash-screen { background-color: #0f1722 !important; } ' +
                    '.splash-logo { filter: brightness(1.1); } ' +
                    '.typewriter, .typewriter-top, .typewriter-bottom { color: #34d399 !important; } ' +
                    '.typewriter-cursor { background-color: #34d399 !important; }';
                document.head.appendChild(style);
                
                // Also directly target splash if it exists (double protection)
                if (document.getElementById('splash-screen')) {
                    document.getElementById('splash-screen').style.backgroundColor = '#0f1722';
                }
            } else {
                // Ensure light mode theme color
                var themeColor = document.querySelector('meta[name="theme-color"]');
                if (themeColor) {
                    themeColor.setAttribute('content', '#C8E9BE');
                }
            }
        })();
    </script>

                // Remove splash screen from DOM after animation
                setTimeout(() => {

                        splashScreen.parentNode.removeChild(splashScreen);
                    }
                }, 300);
            }
        };

    <script src="/pages/AdminPage.js" defer></script>
    
    <!-- Version and App entry -->
    <script src="/version.js" defer></script>
    <script src="/app.js" defer></script>
    
    <!-- Offline detection with proper return -->
    <script>
        // Store the last attempted URL
        let lastAttemptedUrl = '/';
        
        // Detect offline status
        window.addEventListener('offline', function() {
            // Save current URL before going offline
            if (window.location.pathname !== '/offline.html') {
                lastAttemptedUrl = window.location.pathname + window.location.search;
                sessionStorage.setItem('offline_return_url', lastAttemptedUrl);
            }
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-lg shadow-lg text-white text-sm animate-fade-in-up bg-yellow-600';
            toast.innerText = '📡 You are offline - showing cached content';
            toast.id = 'offline-toast';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        });
        
        window.addEventListener('online', function() {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-lg shadow-lg text-white text-sm animate-fade-in-up bg-green-600';
            toast.innerText = '✅ Back online!';
            toast.id = 'online-toast';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
            
            // If we're on offline page, go back to where we came from
            if (window.location.pathname === '/offline.html') {
                const returnUrl = sessionStorage.getItem('offline_return_url') || '/';
                window.location.href = returnUrl;
            }
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js').catch(function(err) {
                    
                });
            });
        }
        
        if (window.PreloadHelpers) {
            window.addEventListener('load', function() {
                setTimeout(function() {
                    PreloadHelpers.initHoverPreloading();
                }, 2000);
            });
        }
        
        console.log('UnaDomot v' + (window.APP_VERSION || '1.0.0') + ' loaded');
    </script>
