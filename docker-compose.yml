services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unadomot
      POSTGRES_PASSWORD: unadomot
      POSTGRES_DB: unadomot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unadomot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgres://unadomot:unadomot@db:5432/unadomot
      JWT_SECRET: change-me-to-a-random-string-of-at-least-32-bytes
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: info,tower_http=info
      PUBLIC_WEB_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
