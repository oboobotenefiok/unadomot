<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline - UnaDomot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0fdf4;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-card {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .icon {
            font-size: 80px;
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        h1 {
            font-size: 28px;
            color: #052e16;
            margin-bottom: 12px;
            font-weight: 700;
        }
        p {
            color: #4b5563;
            margin-bottom: 32px;
            line-height: 1.6;
            font-size: 16px;
        }
   
        .retry-btn {
            background: #052e16;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            margin-bottom: 16px;
        }
        .retry-btn:hover {
            background: #166534;
        }
        .browse-link {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .browse-link:hover {
            color: #052e16;
        }
        .logo {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <img src="/vault/img/unadomot.jpg" alt="UnaDomot" class="logo" onerror="this.style.display='none'">
        <div class="icon">📡</div>
        <h1>You're offline!</h1>
     


        <button onclick="window.location.reload()" class="retry-btn">
            🔄 Try Again
        </button>
        
       
    </div>
<script>
    // Save where user tried to go
    (function() {
        // Check if we came from somewhere
        const referrer = document.referrer;
        if (referrer && referrer.includes(window.location.origin)) {
            const path = new URL(referrer).pathname;
            sessionStorage.setItem('offline_return_url', path);
        }
        
        // Add click handler for manual retry
        document.querySelector('.retry-btn').addEventListener('click', function(e) {
            e.preventDefault();
            const returnUrl = sessionStorage.getItem('offline_return_url') || '/';
            window.location.href = returnUrl;
        });
    })();
</script>
    <script>
        // Auto-retry when connection returns
        window.addEventListener('online', function() {
            window.location.reload();
        });
    </script>
</body>
</html>
