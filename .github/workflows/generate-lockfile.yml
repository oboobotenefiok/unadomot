name: generate-lockfile
on:
  push:
    paths:
      - .github/workflows/generate-lockfile.yml
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rewrite/flutter-rust-postgres
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Cargo.lock
        working-directory: services/api
        run: cargo generate-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/Cargo.lock
          git rm .github/workflows/generate-lockfile.yml
          git commit -m "T-BASE-2: add Cargo.lock"
          git push origin HEAD:rewrite/flutter-rust-postgres
