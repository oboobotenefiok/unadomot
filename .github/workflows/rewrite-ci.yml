name: Rewrite CI
on:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']
    paths: ['apps/flutter_app/**', 'services/api/**', '.github/workflows/rewrite-ci.yml']
  pull_request:
    paths: ['apps/flutter_app/**', 'services/api/**', '.github/workflows/rewrite-ci.yml']
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
      - name: Analyze, test and build
        working-directory: apps/flutter_app
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: unadomot-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
