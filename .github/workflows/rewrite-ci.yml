name: Rewrite CI
on:
  workflow_dispatch:
  push:
    branches: [rewrite/flutter-rust-postgres]
    tags: ['ci']
  pull_request:
    branches: [rewrite/flutter-rust-postgres]
permissions:
  contents: write
concurrency:
  group: rewrite-ci
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  NO_COLOR: 1
  RUST_BACKTRACE: 1
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unadomot
          POSTGRES_PASSWORD: unadomot
          POSTGRES_DB: unadomot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://unadomot:unadomot@localhost:5432/unadomot_test
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-bytes
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api -> target
      - name: Rust checks
        run: |
          set +e
          : > /tmp/rust.log
          # cargo fmt --all -- --check
          cargo fmt --all >> /tmp/rust.log 2>&1; fmt=$?
          cargo clippy --all-targets -- -D warnings >> /tmp/rust.log 2>&1; clippy=$?
          cargo test >> /tmp/rust.log 2>&1; tests=$?
          if [ $fmt -ne 0 ] || [ $clippy -ne 0 ] || [ $tests -ne 0 ]; then
            grep -E "error|warning|FAILED|panicked|assertion|expected|left|right" /tmp/rust.log > error-summary.txt || true
            if [ ! -s error-summary.txt ]; then tail -n 300 /tmp/rust.log > error-summary.txt; fi
            exit 1
          fi
      - name: Publish error summary
        if: failure() && !cancelled()
        working-directory: .
        run: |
          if [ -f services/api/error-summary.txt ]; then cp services/api/error-summary.txt error-summary.txt; fi
          if [ ! -f error-summary.txt ]; then echo "CI failed before an error summary was generated." > error-summary.txt; fi
          cp error-summary.txt /tmp/error-summary.txt
          cp /tmp/rust.log /tmp/rust-full.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-rust
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/error-summary.txt error-summary.txt
          cp /tmp/rust-full.log rust-full.log 2>/dev/null || true
          {
            echo "# Rust CI failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.md
          git add error-summary.txt status.md
          [ -f rust-full.log ] && git add rust-full.log
          git commit -m "Rust CI failure for ${GITHUB_SHA}"
          git push --force origin ci-logs-rust
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t unadomot-api:ci services/api
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/flutter_app/android/**/*.gradle*', 'apps/flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Apply Android permissions
        run: bash scripts/apply_android_permissions.sh
      - name: Analyze, test and build
        working-directory: apps/flutter_app
        run: |
          set +e
          : > /tmp/flutter.log
          flutter pub get >> /tmp/flutter.log 2>&1; pub=$?
          flutter analyze --no-fatal-infos >> /tmp/flutter.log 2>&1; analyze=$?
          flutter test >> /tmp/flutter.log 2>&1; tests=$?
          flutter build apk --debug --dart-define=API_BASE_URL=https://unadomot.fly.dev >> /tmp/flutter.log 2>&1; build=$?
          if [ $pub -ne 0 ] || [ $analyze -ne 0 ] || [ $tests -ne 0 ] || [ $build -ne 0 ]; then
            grep -E "error|warning|FAILED|Exception|failed|Error:" /tmp/flutter.log > ../../error-summary.txt || true
            if [ ! -s ../../error-summary.txt ]; then tail -n 300 /tmp/flutter.log > ../../error-summary.txt; fi
            exit 1
          fi
      - name: Publish error summary
        if: failure() && !cancelled()
        run: |
          if [ ! -f error-summary.txt ]; then echo "CI failed before an error summary was generated." > error-summary.txt; fi
          cp error-summary.txt /tmp/error-summary.txt
          cp /tmp/flutter.log /tmp/flutter-full.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-android
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/error-summary.txt error-summary.txt
          cp /tmp/flutter-full.log flutter-full.log 2>/dev/null || true
          {
            echo "# Android CI failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.md
          git add error-summary.txt status.md
          [ -f flutter-full.log ] && git add flutter-full.log
          git commit -m "Android CI failure for ${GITHUB_SHA}"
          git push --force origin ci-logs-android
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: unadomot-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
