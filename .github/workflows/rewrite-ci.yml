name: Rewrite CI
"on":
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "rewrite-ci-${{ github.ref }}"
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"
  RUST_BACKTRACE: "1"
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unadomot
          POSTGRES_PASSWORD: unadomot
          POSTGRES_DB: unadomot_test
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
    env:
      DATABASE_URL: postgres://unadomot:unadomot@localhost:5432/unadomot_test
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-bytes
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api -> target
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2023-0071
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t unadomot-api:ci .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "gradle-${{ runner.os }}-${{ hashFiles('apps/flutter_app/android/**/*.gradle*', 'apps/flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Configure release signing
        working-directory: apps/flutter_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          app = Path('android/app/build.gradle.kts')
          s = app.read_text()
          if 'import java.util.Properties' not in s:
              s = 'import java.util.Properties\nimport java.io.FileInputStream\n\n' + s
          if 'signingConfigs {' not in s:
              marker = '    buildTypes {'
              block = '''    signingConfigs {
                  create("release") {
                      val keystoreProperties = Properties()
                      val keystorePropertiesFile = rootProject.file("key.properties")
                      if (keystorePropertiesFile.exists()) {
                          keystoreProperties.load(FileInputStream(keystorePropertiesFile))
                      }
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                  }
              }

          '''
              s = s.replace(marker, block + marker, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          app.write_text(s)
          PY
      - name: Apply Android permissions and deep links
        run: |
          bash scripts/apply_android_permissions.sh
          bash scripts/apply_android_deep_links.sh
      - name: Install dependencies
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests with coverage
        working-directory: apps/flutter_app
        run: flutter test --coverage
      - name: Build release APK
        working-directory: apps/flutter_app
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=API_BASE_URL=https://unadomot.fly.dev --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} 2>&1 | tee /tmp/apk.log
      - name: Verify required Android permissions
        working-directory: apps/flutter_app
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -r | head -n 1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          for permission in INTERNET CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            "$AAPT" dump permissions "$APK" | grep -q "android.permission.$permission"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unadomot-release-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish release failure
        if: failure()
        run: |
          cp /tmp/apk.log /tmp/apk-full.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-apk
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/apk-full.log apk-full.log 2>/dev/null || true
          {
            echo "# Release APK failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.md
          git add status.md
          [ -f apk-full.log ] && git add apk-full.log
          git commit -m "Release APK failure for ${GITHUB_SHA}"
          git push --force origin ci-logs-apk
