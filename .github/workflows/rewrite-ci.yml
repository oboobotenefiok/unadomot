name: Rewrite CI
on:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']
    paths: ['apps/flutter_app/**', 'services/api/**', '.github/workflows/rewrite-ci.yml']
  pull_request:
    paths: ['apps/flutter_app/**', 'services/api/**', '.github/workflows/rewrite-ci.yml']
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unadomot
          POSTGRES_PASSWORD: unadomot
          POSTGRES_DB: unadomot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://unadomot:unadomot@localhost:5432/unadomot_test
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-bytes
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api -> target
      - run: cargo fmt
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Analyze, test and build
        working-directory: apps/flutter_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: unadomot-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
