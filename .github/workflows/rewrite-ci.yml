name: Rewrite CI
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "rewrite-ci-${{ github.ref }}"
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"
  RUST_BACKTRACE: "1"
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unadomot
          POSTGRES_PASSWORD: unadomot
          POSTGRES_DB: unadomot_test
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
    env:
      DATABASE_URL: postgres://unadomot:unadomot@localhost:5432/unadomot_test
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-bytes
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api -> target
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2023-0071
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t unadomot-api:ci .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "gradle-${{ runner.os }}-${{ hashFiles('apps/flutter_app/android/**/*.gradle*', 'apps/flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Apply Android permissions and deep links
        run: |
          bash scripts/apply_android_permissions.sh
          bash scripts/apply_android_deep_links.sh
      - name: Install dependencies
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests with coverage
        working-directory: apps/flutter_app
        run: flutter test --coverage
      - name: Build release APK
        working-directory: apps/flutter_app
        run: flutter build apk --release --dart-define=API_BASE_URL=https://unadomot.fly.dev
      - name: Verify required Android permissions
        working-directory: apps/flutter_app
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -r | head -n 1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          for permission in INTERNET CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            "$AAPT" dump permissions "$APK" | grep -q "android.permission.$permission"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unadomot-release-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
