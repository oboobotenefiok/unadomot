name: Rewrite CI
"on":
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "rewrite-ci-${{ github.ref }}"
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  NO_COLOR: "1"
  RUST_BACKTRACE: "1"
jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: unadomot
          POSTGRES_PASSWORD: unadomot
          POSTGRES_DB: unadomot_test
        ports:
          - "5432:5432"
        options: "--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5"
    env:
      DATABASE_URL: postgres://unadomot:unadomot@localhost:5432/unadomot_test
      JWT_SECRET: test-secret-that-is-at-least-32-bytes-long
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-bytes
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/api -> target
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t unadomot-api:ci .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: "gradle-${{ runner.os }}-${{ hashFiles('apps/flutter_app/android/**/*.gradle*', 'apps/flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}"
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Apply Android permissions and deep links
        run: |
          bash scripts/apply_android_permissions.sh
          bash scripts/apply_android_deep_links.sh
      - name: Install dependencies
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests with coverage
        working-directory: apps/flutter_app
        run: flutter test --coverage
      - name: Build debug APK
        working-directory: apps/flutter_app
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://unadomot.fly.dev
      - name: Verify required Android permissions
        working-directory: apps/flutter_app
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -r | head -n 1)
          APK=build/app/outputs/flutter-apk/app-debug.apk
          for permission in INTERNET CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION; do
            "$AAPT" dump permissions "$APK" | grep -q "android.permission.$permission"
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: unadomot-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  publish-logs:
    needs: [rust, audit, docker, android]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch failed run logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run view ${{ github.run_id }} --log > ci-failure.log
      - name: Publish logs to ci-logs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp "$GITHUB_WORKSPACE/ci-failure.log" ci-failure.log 2>/dev/null || true
          {
            echo "# Rewrite CI failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.md
          git add status.md ci-failure.log
          git commit -m "CI failure for ${GITHUB_SHA}"
          git push --force origin ci-logs
