name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build debug APK
        working-directory: apps/flutter_app
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://unadomot.fly.dev
      - uses: actions/upload-artifact@v4
        with:
          name: unadomot-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
