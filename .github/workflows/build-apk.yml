name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [rewrite/flutter-rust-postgres]
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/build-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Apply Android permissions and deep links
        run: |
          bash scripts/apply_android_permissions.sh
          bash scripts/apply_android_deep_links.sh
      - name: Build release APK
        working-directory: apps/flutter_app
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: |
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://unadomot.fly.dev \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: unadomot-release-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
