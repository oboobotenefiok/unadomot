name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Ensure Android platform files
        run: |
          if [ ! -d apps/flutter_app/android ]; then
            flutter create --project-name unadomot --org com.unadomot --platforms android apps/flutter_app
          fi
      - name: Set app display name
        run: |
          MANIFEST=apps/flutter_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="UnaDomot"/' "$MANIFEST"
      - name: Get dependencies
        working-directory: apps/flutter_app
        run: flutter pub get
      - name: Generate launcher icons
        working-directory: apps/flutter_app
        run: dart run flutter_launcher_icons
      - name: Build debug APK
        working-directory: apps/flutter_app
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://unadomot.fly.dev
      - uses: actions/upload-artifact@v4
        with:
          name: unadomot-debug-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
