name: Deploy API
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: |
          set +e
          flyctl deploy --remote-only --config services/api/fly.toml > /tmp/deploy.log 2>&1
          status=$?
          cat /tmp/deploy.log
          exit $status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-failure-log
          path: /tmp/deploy.log
          if-no-files-found: ignore
          retention-days: 7
