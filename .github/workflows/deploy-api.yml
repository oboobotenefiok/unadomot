name: Deploy API
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: |
          set +e
          flyctl deploy --remote-only --config services/api/fly.toml > /tmp/deploy.log 2>&1
          status=$?
          cat /tmp/deploy.log
          exit $status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Publish deploy failure
        if: failure()
        run: |
          cp /tmp/deploy.log /tmp/deploy-full.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs-deploy
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp /tmp/deploy-full.log deploy-full.log 2>/dev/null || true
          {
            echo "# API deploy failure"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Ref: ${GITHUB_REF_NAME}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > status.md
          git add status.md
          [ -f deploy-full.log ] && git add deploy-full.log
          git commit -m "API deploy failure for ${GITHUB_SHA}"
          git push --force origin ci-logs-deploy
